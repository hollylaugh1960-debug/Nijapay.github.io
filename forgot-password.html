<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | JODEK PAY</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/services.css">

</head>


<body class="service-body">


    <!-- ================= HEADER ================= -->

    <header class="service-header">

        <a href="login.html"
           class="back-dashboard">

            ← Login

        </a>

        <div class="service-logo">

            JODEK <span>PAY</span>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="service-main">


        <section class="service-card-form password-reset-card">


            <div class="form-heading">

                <div class="service-big-icon">
                    🔐
                </div>

                <p class="service-label">
                    ACCOUNT RECOVERY
                </p>

                <h1>
                    Forgot Your
                    <span>Password?</span>
                </h1>

                <p>
                    Enter the email address associated
                    with your JODEK PAY account and we will
                    send you a password reset link.
                </p>

            </div>



            <!-- ================= FORM ================= -->

            <form id="forgotPasswordForm">


                <div class="form-group">

                    <label for="resetEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>



<button type="submit"
                    class="service-submit"
                    id="resetPasswordBtn">

    Send Reset Link

       </button>


            </form>



            <!-- ================= MESSAGE ================= -->

            <div
                id="resetMessage"
                class="reset-message"
                hidden>
            </div>



            <div class="reset-links">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">

            JODEK <span>PAY</span>

        </div>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="help.html">
                Help & Support
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="privacy.html">
                Privacy Policy
            </a>

            <a href="terms.html">
                Terms & Conditions
            </a>

        </div>


        <p>
            © 2026 Jodek Pay. All Rights Reserved.
        </p>

    </footer>



    <!-- ================= SUPABASE ================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/forgot-password.js"></script>

</body>

</html>
