<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Jodek PAY</title>

    <!-- <link rel="stylesheet"
          href="css/style.css"> -->

    <link rel="stylesheet"
          href="css/auth.css"> 

</head>


<body class="auth-body">


    <main class="auth-container">


        <!-- LEFT SIDE -->

        <section class="auth-info">

            <div class="auth-logo">
                JODEK <span>PAY</span>
            </div>


            <div class="auth-info-content">

                <p class="auth-label">
                    WELCOME BACK
                </p>
<h1>Everything You Need,<span>In One Place.</span>
                </h1>

                <p>
Login to manage your wallet,buy airtime and data, pay bills,manage your subscriptions and access all your utility services.
                </p>

            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="auth-form-section">


            <div class="auth-form-container">


                <div class="auth-heading">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create Account
                        </a>
                    </p>

                </div>


 <form id="loginForm">
<!-- EMAIL / PHONE -->

<div class="form-group">
<label for="loginIdentifier">
    Email Address
</label>

<input                                   type="text"                          id="loginIdentifier"                            name="loginIdentifier"                           placeholder="Enter your email address "                           autocomplete="username"                           required >
</div>


      
<!-- PASSWORD -->

<div class="form-group">

    <div class="password-label">

        <label for="loginPassword">
            Password
        </label>

        <a href="forgot-password.html" class="forgot-password">
    Forgot Password?
</a>


    </div>


    <div class="password-wrapper">

        <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-target="loginPassword"
            aria-label="Show password">

            👁️

        </button>

    </div>

</div>

    <!-- REMEMBER -->
<label class="remember-me">
<input                            type="checkbox"                           id="rememberMe" >
<span>                            Remember me</span></label>


       <!-- LOGIN -->

<button type="submit"              class="auth-submit"> Login</button>  </form>
</div>
  </section>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/auth.js"></script>

</body>
</html>
